name: Build

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:

    runs-on: windows-latest

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "baoxin1100@users.noreply.github.com"
          git config --global user.name "baoxin1100"
          echo "action_state=yellow" >> $env:GITHUB_ENV
          echo "${{ env.action_state }}"

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set UTF-8 encoding
        run: |
          set PYTHONIOENCODING=utf-8
          set PYTHONLEGACYWINDOWSSTDIO=utf-8
          echo PYTHONIOENCODING=utf-8 >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: inline_ok_requirements #把ok-script加入源码, 从requirements.txt中删除以提高升级更新速度
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ github.ref_name }}

      - name: Run tests
        run: |
          Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
              Write-Host "Running tests in $($_.FullName)"
              python -m unittest $_.FullName
          }

      - name: Build with PyAppify Action
        id: build-app
        uses: ok-oldking/pyappify-action@master #使用pyappify打包exe

      - name: Package lightweight patch zip
        run: |
          New-Item -ItemType Directory -Force -Path patch_stage | Out-Null
          Copy-Item -Recurse -Force ok_tasks patch_stage\ok_tasks
          Set-Content -Path patch_stage\使用说明.txt -Value "1. 先完全关闭 ok-kes.exe`r`n2. 先删除旧的 ok-kes安装目录\data\apps\ok-kes\working\ok_tasks 文件夹，再将压缩包里的 ok_tasks 放入 working\（勿直接合并覆盖，避免旧版残留文件报错）`r`n3. 重启 ok-kes.exe 即可生效" -Encoding UTF8
          Compress-Archive -Path patch_stage\* -DestinationPath "pyappify_dist\ok-kes-patch-${{ github.ref_name }}.zip" -Force

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          generate_release_notes: true
          body: |
            基于 `baoxin1100/ok-kes` `v1.4.17` 打包发行，以下为相对原仓库 `v1.4.17` 的**累计全部新增与修复内容**：

            ### 1. 卡厄思模式新增功能
            - **新增「优先训练」开关（.7）**：开启后在休息点不再执行冥想与休息，优先点击右上角「训练」获取中立卡牌；未命中「卡牌奖励优先级」时自动跳过并确认返回，随后继续执行德朗商店等后续流程
            - **装备刻印刷取与三槽位独立追踪（.1~.6）**：
              - 开启「刻印刷取」后按「刻印优先级」自动刷取光明/黑暗刻印；未命中目标词条时不买不装直接提炼
              - 支持按 3 个装备槽位独立记录已命中刻印状态，已命中目标刻印的槽位不会被无刻印装备或低优先级装备覆盖，并支持最终 Boss 前已命中词条数量保底检测
              - 槽位未命中目标刻印时允许免费装备/无刻印优先级装备正常升级
            - **特例神话与事件装备豁免 + 简繁同义名互通（.4~.7）**：
              - 支持特例神话装备及「翠绿/深绿」系列事件装备（`翠绿之昼 / 深绿白昼`、`翠绿之夜 / 深绿黑夜`、`翠绿的枷锁 / 深绿桎梏`）豁免刻印覆盖
              - 内置简繁装备同义名映射（如 `乱世之触 / 混沌触手`、`混沌之识 / 混沌指控` 及翠绿/深绿系列），防止因繁简名称差异被低优先级装备顶掉
            - **面具卡牌刻印与记忆加工增强（.4~.7）**：
              - 「面具卡牌刻印」支持填写 1 个或 2 个目标词条（逗号分隔）：填 1 个时双槽均刷该词条，填 2 个时不分先后凑齐两种（1+2）
              - 移除独立「加工记忆」开关，改为填写「加工记忆词条」即自动启用精密记忆加工，留空不加工；修复简体中文精密记忆加工页面被误接管的问题
              - 修复「指定记忆卡牌」留空时在赛季记忆卡牌选择页仍会耗尽 5 次刷新并误触发退档重开的问题（留空时直接随机选卡继续第 2 层）

            ### 2. 稳定性与识别修复
            - **全局多行区域 OCR 排序优化（.6）**：按行聚类从左到右、从上到下排序拼接，解决人格面具/卡牌/事件描述偶发错位问题
            - **高 TB 强制删档标记保留（.5~.6）**：修复「探险结果」页提前清空强制删档标记导致未达标高 TB 存档未删除的问题
            - **中央确认弹窗范围收窄（.6）**：将 `handle_center_confirm` 识别范围收窄至 `(0.42, 0.52, 0.80, 0.76)`，防止事件卡文案误触发死循环
            - **商店特价价格与界面修复（.1~.2）**：支持解析带空格或删除线符号的商店特价价格；记忆卡牌分配界面无跳过按钮时不再误点空白坐标；补全 `coco_annotations.json` 中 `treasure2`/`treasure3` 的 `image_id` 记录
            - **清理与打包优化（.1~.7）**：移除早期独立任务 `GetMengbian.py`（刷梦边）；随发行自动打包轻量补丁 `ok-kes-patch-*.zip`（使用需先删除旧 `ok_tasks` 文件夹再放入新版）
          files: pyappify_dist/*
