name: Build

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:

    runs-on: windows-latest

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "baoxin1100@users.noreply.github.com"
          git config --global user.name "baoxin1100"
          echo "action_state=yellow" >> $env:GITHUB_ENV
          echo "${{ env.action_state }}"

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set UTF-8 encoding
        run: |
          set PYTHONIOENCODING=utf-8
          set PYTHONLEGACYWINDOWSSTDIO=utf-8
          echo PYTHONIOENCODING=utf-8 >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: inline_ok_requirements #把ok-script加入源码, 从requirements.txt中删除以提高升级更新速度
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ github.ref_name }}

      - name: Run tests
        run: |
          Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
              Write-Host "Running tests in $($_.FullName)"
              python -m unittest $_.FullName
          }

      - name: Build with PyAppify Action
        id: build-app
        uses: ok-oldking/pyappify-action@master #使用pyappify打包exe

      - name: Package lightweight patch zip
        run: |
          New-Item -ItemType Directory -Force -Path patch_stage | Out-Null
          Copy-Item -Recurse -Force ok_tasks patch_stage\ok_tasks
          Set-Content -Path patch_stage\使用说明.txt -Value "1. 先完全关闭 ok-kes.exe`r`n2. 先删除旧的 ok-kes安装目录\data\apps\ok-kes\working\ok_tasks 文件夹，再将压缩包里的 ok_tasks 放入 working\（勿直接合并覆盖，避免旧版残留文件报错）`r`n3. 重启 ok-kes.exe 即可生效" -Encoding UTF8
          Compress-Archive -Path patch_stage\* -DestinationPath "pyappify_dist\ok-kes-patch-${{ github.ref_name }}.zip" -Force

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          generate_release_notes: true
          body: |
            基于 `baoxin1100/ok-kes` v1.4.17 打包发行（已包含前期刻印刷取、特例神话装备、国服精密加工记忆及强制删档等全部合入内容），本版累计新增修复：
            - 优化全局多行区域 OCR 文本拼接顺序，按行聚类从左到右、从上到下排序，解决人格面具/卡牌/事件描述偶发错位问题
            - 修复「探险结果」页调用 `reset_mission_status` 提前清空强制删档标记导致未达标高 TB 存档未删除的问题
            - 「面具卡牌刻印」支持填写 1 个或 2 个目标词条（逗号分隔）：填 1 个时双槽均刷该词条；填 2 个时不分先后分别凑齐两种（1+2）
            - 修复「指定记忆卡牌」留空时在赛季记忆卡牌选择页仍会用完 5 次刷新并误触发退档重开的问题（留空时直接随机选卡继续第 2 层）
            - 修复装备优先级匹配未做简繁同义名互通（如配置「乱世之触」时未识别繁中「混沌触手」导致被低优先级装备顶掉）的问题
            - 收窄 `handle_center_confirm` 中央确认弹窗识别范围至 `(0.42, 0.52, 0.80, 0.76)`，防止事件卡文案误触发死循环
            - 新增「优先训练」开关：开启后在休息点不再冥想和休息，优先点击右上角「训练」获取中立卡牌，未命中「卡牌奖励优先级」时跳过并确认返回，随后继续执行德朗商店等后续流程
            - 新增「翠绿之昼 / 深绿白昼」「翠绿之夜 / 深绿黑夜」「翠绿的枷锁 / 深绿桎梏」简繁同义名互通及刻印特例豁免，避免误刷刻印或被低优先级装备顶掉
            - 移除独立「加工记忆」开关，改为填写「加工记忆词条」即自动在记忆雕琢界面执行记忆加工，留空则不加工
            - 删除早期独立任务 `GetMengbian.py`（刷梦边），由卡厄思模式统一覆盖
            - 新增「指定装备」配置：留空不生效；填写后在第 1 层中继检查点（`结算`节点）全部操作完成后，若刷存档主战员未获得任意指定装备（支持逗号分隔与简繁同义名互通），直接点击右上角菜单执行重开
            - 新增「不毕业不换图」开关：开启后在第 2 层最后一个休息点全部操作完成后（最终 Boss 前），若刷存档主战员 3 个槽位装备未全部满足各自 `装备1/2/3号位优先级` 第 1 位则退出并强制删档重来；若同时开启「刻印刷取」，还会额外要求 3 个槽位刻印均为 `刻印优先级` 第 1 位（优先级高于「最终战前已命中词条至少为多少」）
            - 修复更换「刷存档主战员」或队伍后误把装备塞给其他主战员（如米卡）的问题：任务重置与进入信息统计页前自动清除内存及磁盘上的旧 `target_member*.png` 头像特征，未刷新当前局头像前禁止复用旧特征，并将 `_find_target_member_index`、`_prioritize_target_member_click` 及 `_scroll_to_target_member_for_card_removal` 匹配阈值提高至 `0.55`
          files: pyappify_dist/*
